stage: 09-local-data-privacy
status: not_started
depends_on:
  - 08-lifecycle-recovery
implementation_agent_default: claude-code
review_agent_default: codex
reviewer_must_differ: true
personas:
  - agents/active/engineering-privacy-engineer.md
  - agents/active/data-privacy-officer.md
  - agents/active/engineering-mobile-app-builder.md
  - agents/active/security-secrets-credential-engineer.md
read:
  - src/core/data/
  - src/core/model/
  - src/core/security/
  - docs/product/launcher-v1.md
modify:
  - src/core/data/
  - src/core/model/
  - src/core/security/
  - docs/security/
  - stages/09-local-data-privacy/
forbidden:
  - advertising SDKs
  - unnecessary analytics identifiers
  - cloud dependency for core launcher operation
  - real child test data
validation_commands:
  - cd src; .\gradlew.bat test lint
